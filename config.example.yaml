# Copy this file to config.yaml and fill in your own filters/credentials.
# config.yaml is gitignored so you don't accidentally commit secrets.

filters:
  make: null               # null = any make
  model: null               # null = any model
  min_year: 2014
  max_year: null
  max_mileage: 150000
  min_price: null
  max_price: 6000
  postcode: "FK8 2BJ"
  radius_miles: 60
  fuel_type: null          # e.g. "Petrol", "Diesel", "Electric", "Hybrid"
  transmission: null       # e.g. "Manual", "Automatic"

sources:
  autotrader:
    enabled: true
    max_pages: 3
  gumtree:
    enabled: true
    max_pages: 3

pricing:
  # Group comparable listings by make+model+year ("make_model_year") or just
  # make+model ("make_model") when estimating a market price.
  group_by: "make_model_year"
  # Flag a listing as a good deal if it's priced this many % below the
  # median price of its comparable group.
  deal_threshold_pct: 15.0
  # Minimum number of comparable listings required before trusting the
  # market price estimate for a group.
  min_group_size: 3

notifications:
  # Any combination of: console, desktop, email, telegram
  backends:
    - console
    - desktop
  email:
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    use_tls: true
    username: "you@gmail.com"
    password: "${EMAIL_APP_PASSWORD}"   # pulled from env var, or hardcode (not recommended)
    from_addr: "you@gmail.com"
    to_addr: "you@gmail.com"
  telegram:
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"

database:
  path: "car_deals.db"

scraping:
  request_delay_seconds: 3.0
  timeout_seconds: 15
  # How long the AutoTrader scraper waits for listing cards to render after
  # navigation. Raise this if running from a datacenter/VPS network path
  # where page load is slower than on a home connection.
  render_timeout_seconds: 30
  # When the AutoTrader scraper finds 0 listing cards, save a screenshot +
  # the full rendered HTML here so you can see exactly what the browser saw
  # (e.g. useful for silent bot-detection that serves a stripped page with
  # no visible challenge). Set to null to disable.
  debug_dir: "debug"
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
